name: iOS Build (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile (skip App Intents metadata sur PapillonKit)
        run: |
          perl -0pi -e 's/post_install do \|installer\|/post_install do |installer|\n    installer.pods_project.targets.each do |t|\n      next unless t.name.start_with?("PapillonKit")\n      t.build_configurations.each do |c|\n        c.build_settings["LM_SKIP_METADATA_EXTRACTION"] = "YES"\n      end\n    end/' ios/Podfile
          grep -n -A6 "post_install" ios/Podfile

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Archive iOS app (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace Papillon.xcworkspace \
            -scheme Papillon \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Papillon.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= 

      - name: Create IPA
        run: |
          cd ios/build
          rm -rf Payload Papillon.ipa
          mkdir Payload
          cp -R Papillon.xcarchive/Products/Applications/Papillon.app Payload/
          zip -qry Papillon.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Papillon.ipa
          path: ios/build/Papillon.ipa

name: iOS Build (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps || true

      - name: Expo prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Archive iOS app (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace Papillon.xcworkspace \
            -scheme Papillon \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Papillon.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            SKIP_INSTALL=NO

      - name: Create IPA
        run: |
          cd ios/build
          rm -rf Payload Papillon.ipa
          mkdir Payload
          cp -R Papillon.xcarchive/Products/Applications/Papillon.app Payload/
          zip -qry Papillon.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Papillon.ipa
          path: ios/build/Papillon.ipa
